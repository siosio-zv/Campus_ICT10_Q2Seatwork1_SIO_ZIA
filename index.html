<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Verification System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>

    <style>
        body{
            background-color: lightblue
        }
    </style>

</head>
<body class="container mt-5">
    <h1>ICT Club {Candidate Verification}</h1>
    <p>Enter your first name and last name to check if you are a member</p>

    <label for="first_name" class="form-label">First Name</label>
    <input type="text" id="first_name" class="form-control mb-3" placeholder="e.g. Zia">

    <label for="last_name" class="form-label">Last Name</label>
    <input type="text" id="last_name" class="form-control mb-3" placeholder="e.g. Sio">

    <button type="button" class="btn btn-success" py-click="verify_candidate">VERIFY</button>

    <h3 class="mt-4">RESULT</h3>
    <div id="result" class="alert alert-secondary">Waiting for a name...</div>

    <py-script src="main.py"></py-script>
</body>
</html>
